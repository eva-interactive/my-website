<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Столкновение Галактик с Мерцающим Фоном</title>
    <meta name="description" content="Интерактивная визуализация в цифровом портфолио Eva Interactive." />
    <style>
        body { margin: 0; overflow: hidden; background-color: #020206; color: white; font-family: sans-serif; }
        canvas { display: block; background-color: #020206; }
        #info { position: absolute; top: 10px; width: 100%; text-align: center; font-size: 14px; color: #fff; background: rgba(0,0,0,0.7); padding: 6px 0; }
        #controls { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10; }
        button { background: #1a1a2e; border: 1px solid #413c69; color: white; padding: 12px 20px; font-size: 14px; border-radius: 5px; }
    </style>
</head>
<body>
    <div id="info">Симуляция: Мерцающий глубокий космос и слияние галактик.</div>
    <div id="controls">
        <button onclick="restartSimulation()">Запустить заново</button>
    </div>
    <canvas id="space"></canvas>

    <script>
        const canvas = document.getElementById('space');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let particles = [];
        let comets = [];
        let bgStars = []; 
        let gal1, gal2;
        let isMerged = false;

        // Генерируем глубокий космос с параметрами мерцания для каждой звезды
        function generateBackgroundStars() {
            bgStars = [];
            for (let i = 0; i < 100; i++) {
                bgStars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 1.4 + 0.4,
                    alpha: Math.random(), // Текущая яркость
                    speed: Math.random() * 0.03 + 0.01, // Скорость мерцания
                    dir: Math.random() > 0.5 ? 1 : -1 // Направление (ярче/тусклее)
                });
            }
        }

        function initSimulation() {
            particles = [];
            comets = [];
            isMerged = false;

            generateBackgroundStars();

            // Большая галактика
            gal1 = { x: canvas.width * 0.55, y: canvas.height * 0.5, vx: 0, vy: 0, mass: 200, color: '#4a00e0' };
            // Малая галактика
            gal2 = { x: canvas.width * 0.1, y: canvas.height * 0.2, vx: 2.0, vy: 1.2, mass: 70, color: '#00ffaa' };

            // Звезды первой галактики
            for (let i = 0; i < 250; i++) {
                let r = Math.pow(Math.random(), 1.2) * 140 + 5;
                let angle = (i % 3) * (Math.PI * 2 / 3) + r * 0.03 + (Math.random() - 0.5) * 0.2;
                particles.push({
                    x: gal1.x + Math.cos(angle) * r,
                    y: gal1.y + Math.sin(angle) * r,
                    vx: -Math.sin(angle) * (Math.sqrt(gal1.mass / (r + 5)) * 0.5),
                    vy: Math.cos(angle) * (Math.sqrt(gal1.mass / (r + 5)) * 0.5),
                    size: Math.random() * 1.3 + 0.3,
                    color: Math.random() > 0.4 ? gal1.color : '#ffffff',
                    isPlanet: i % 40 === 0
                });
            }

            // Звезды второй галактики
            for (let i = 0; i < 150; i++) {
                let r = Math.pow(Math.random(), 1.2) * 70 + 5;
                let angle = (i % 2) * Math.PI + r * 0.05 + (Math.random() - 0.5) * 0.2;
                particles.push({
                    x: gal2.x + Math.cos(angle) * r,
                    y: gal2.y + Math.sin(angle) * r,
                    vx: -Math.sin(angle) * (Math.sqrt(gal2.mass / (r + 5)) * 0.5) + gal2.vx,
                    vy: Math.cos(angle) * (Math.sqrt(gal2.mass / (r + 5)) * 0.5) + gal2.vy,
                    size: Math.random() * 1.3 + 0.3,
                    color: Math.random() > 0.4 ? gal2.color : '#ffffff',
                    isPlanet: i % 30 === 0
                });
            }

            // Межзвездные кометы
            for (let i = 0; i < 4; i++) {
                comets.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 3,
                    vy: (Math.random() - 0.5) * 3,
                    history: []
                });
            }
        }

        function restartSimulation() {
            initSimulation();
        }

        function drawFrame() {
            // Мягкий шлейф движения (космический газ)
            ctx.fillStyle = 'rgba(2, 2, 6, 0.18)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // --- ОБНОВЛЕНИЕ И ОТРИСОВКА МЕРЦАЮЩИХ ФОНОВЫХ ЗВЁЗД ---
            bgStars.forEach(s => {
                // Плавное изменение прозрачности каждой звезды
                s.alpha += s.speed * s.dir;
                
                // Проверка границ яркости
                if (s.alpha >= 0.9) { s.alpha = 0.9; s.dir = -1; }
                if (s.alpha <= 0.15) { s.alpha = 0.15; s.dir = 1; }

                ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // Сближение центров галактик
            let dxC = gal1.x - gal2.x;
            let dyC = gal1.y - gal2.y;
            let distC = Math.sqrt(dxC * dxC + dyC * dyC) || 1;

            if (distC < 20) {
                isMerged = true;
            }

            if (!isMerged) {
                let forceC = 0.15;
                gal2.vx += (dxC / distC) * forceC;
                gal2.vy += (dyC / distC) * forceC;
                gal2.x += gal2.vx;
                gal2.y += gal2.vy;
            } else {
                gal2.x = gal1.x + (gal2.x - gal1.x) * 0.95;
                gal2.y = gal1.y + (gal2.y - gal1.y) * 0.95;
            }

            // Отрисовка ядер галактик
            if (!isMerged) {
                let g2 = ctx.createRadialGradient(gal2.x, gal2.y, 0, gal2.x, gal2.y, 15);
                g2.addColorStop(0, '#ffffff'); g2.addColorStop(0.4, gal2.color); g2.addColorStop(1, 'transparent');
                ctx.fillStyle = g2; ctx.beginPath(); ctx.arc(gal2.x, gal2.y, 15, 0, Math.PI * 2); ctx.fill();
            }

            let g1 = ctx.createRadialGradient(gal1.x, gal1.y, 0, gal1.x, gal1.y, 30);
            g1.addColorStop(0, '#ffffff'); g1.addColorStop(0.3, '#ffaa00'); g1.addColorStop(0.6, gal1.color); g1.addColorStop(1, 'transparent');
            ctx.fillStyle = g1; ctx.beginPath(); ctx.arc(gal1.x, gal1.y, 30, 0, Math.PI * 2); ctx.fill();

            // Движение и притяжение звезд
            particles.forEach(p => {
                let dx1 = gal1.x - p.x;
                let dy1 = gal1.y - p.y;
                let dist1 = Math.sqrt(dx1 * dx1 + dy1 * dy1) || 1;

                let f1 = gal1.mass / (dist1 * dist1 + 400);
                p.vx += (dx1 / dist1) * f1;
                p.vy += (dy1 / dist1) * f1;

                if (!isMerged) {
                    let dx2 = gal2.x - p.x;
                    let dy2 = gal2.y - p.y;
                    let dist2 = Math.sqrt(dx2 * dx2 + dy2 * dy2) || 1;
                    let f2 = gal2.mass / (dist2 * dist2 + 200);
                    p.vx += (dx2 / dist2) * f2;
                    p.vy += (dy2 / dist2) * f2;
                }

                p.vx *= 0.99; p.vy *= 0.99;
                p.x += p.vx; p.y += p.vy;

                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();

                if (p.isPlanet && distC > 40) {
                    ctx.fillStyle = 'rgba(255,255,255,0.4)';
                    ctx.font = '8px sans-serif';
                    ctx.fillText("• планета", p.x + 3, p.y + 3);
                }
            });

            // Движение комет
            comets.forEach(c => {
                let dx = gal1.x - c.x;
                let dy = gal1.y - c.y;
                let dist = Math.sqrt(dx * dx + dy * dy) || 1;
                
                c.vx += (dx / dist) * (120 / (dist + 50));
                c.vy += (dy / dist) * (120 / (dist + 50));
                c.x += c.vx; c.y += c.vy;

                c.history.push({x: c.x, y: c.y});
                if (c.history.length > 8) c.history.shift();

                ctx.strokeStyle = 'rgba(0, 150, 255, 0.3)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                if (c.history.length > 0) {
                    ctx.moveTo(c.history.x, c.history.y);
                    for (let i = 1; i < c.history.length; i++) {
                        ctx.lineTo(c.history[i].x, c.history[i].y);
                    }
                }
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(c.x, c.y, 1.8, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        initSimulation();
        setInterval(drawFrame, 33);
    </script>

</body>
