<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Гиперцветение (Максимальный Эффект)</title>
    <meta name="description" content="Интерактивная визуализация в цифровом портфолио Eva Interactive." />
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #040406;
            font-family: sans-serif;
            user-select: none;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        .info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255,255,255,0.5);
            font-size: 13px;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <canvas id="hyperbloom"></canvas>
    <div class="info">
        • Радужный перелив: автоматически<br>
        • Светящаяся пыльца: активирована<br>
        • Управление: 1 или 2 пальца
    </div>

    <script>
        const canvas = document.getElementById('hyperbloom');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        let baseHue = 0; // Для плавного радужного перелива
        let time = 0;

        // Интерактивные переменные
        let scaleFactor = 1.0; 
        let userAngleX = 0;
        let userAngleY = 0;
        let isDragging = false;
        let startX = 0, startY = 0;
        let initialPinchDist = 0;
        let initialScale = 1.0;

        // Массив для светящейся пыльцы
        const particles = [];
        const maxParticles = 60; // Оптимально для производительности Android

        // Инициализация пыльцы в 3D пространстве вокруг центра
        for (let i = 0; i < maxParticles; i++) {
            particles.push({
                x: (Math.random() - 0.5) * 500,
                y: (Math.random() - 0.5) * 500 - 100,
                z: (Math.random() - 0.5) * 500,
                speedY: 0.5 + Math.random() * 1.5,
                seed: Math.random() * 100,
                size: 1 + Math.random() * 2
            });
        }

        // 3D Проекция
        const FOV = 400;
        function project(x, y, z) {
            const scale = FOV / (FOV + z);
            return {
                x: width / 2 + x * scale * scaleFactor,
                y: (height / 2 + height * 0.15) + y * scale * scaleFactor,
                scale: scale
            };
        }

        // Матрицы вращения
        function rotateX(x, y, z, angle) {
            const rad = angle * Math.PI / 180;
            const cos = Math.cos(rad);
            const sin = Math.sin(rad);
            return { x: x, y: y * cos - z * sin, z: y * sin + z * cos };
        }

        function rotateY(x, y, z, angle) {
            const rad = angle * Math.PI / 180;
            const cos = Math.cos(rad);
            const sin = Math.sin(rad);
            return { x: x * cos + z * sin, y: y, z: -x * sin + z * cos };
        }

        // Touch-интерфейс
        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            } else if (e.touches.length === 2) {
                isDragging = false;
                initialPinchDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                initialScale = scaleFactor;
            }
        }, { passive: true });

        canvas.addEventListener('touchmove', (e) => {
            if (isDragging && e.touches.length === 1) {
                const dx = e.touches[0].clientX - startX;
                const dy = e.touches[0].clientY - startY;

                userAngleY += dx * 0.4;
                userAngleX -= dy * 0.4;
                userAngleX = Math.max(-80, Math.min(80, userAngleX));

                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            } else if (e.touches.length === 2) {
                const currentDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                if (initialPinchDist > 0) {
                    const pinchRatio = currentDist / initialPinchDist;
                    scaleFactor = Math.max(0.4, Math.min(2.5, initialScale * pinchRatio));
                }
            }
        }, { passive: true });

        canvas.addEventListener('touchend', (e) => {
            if (e.touches.length === 0) isDragging = false;
        });

        // Рекурсивный фрактал лепестков
        function drawPetal(x, y, z, size, depth, angleOffset, maxDepth) {
            if (depth > maxDepth) return;

            let rotAngleX = userAngleX + Math.sin(time * 0.1) * 8;
            let p1 = rotateX(x, y, z, rotAngleX);
            p1 = rotateY(p1.x, p1.y, p1.z, userAngleY + angleOffset);

            const foldFactor = Math.sin(time * 0.4 + depth * 0.5) * 0.5 + 0.5;
            const extX = size * Math.sin(foldFactor * Math.PI * 0.3);
            const extY = -size * Math.cos(foldFactor * Math.PI * 0.3);
            const extZ = size * Math.cos(time * 0.2 + depth);

            let p2 = rotateX(x + extX, y + extY, z + extZ, rotAngleX);
            p2 = rotateY(p2.x, p2.y, p2.z, userAngleY + angleOffset);

            const proj1 = project(p1.x, p1.y, p1.z);
            const proj2 = project(p2.x, p2.y, p2.z);

            ctx.beginPath();
            ctx.moveTo(proj1.x, proj1.y);
            ctx.lineTo(proj2.x, proj2.y);
            
            const hue = (baseHue + depth * 20 + foldFactor * 25) % 360;
            ctx.strokeStyle = `hsla(${hue}, 90%, ${50 + depth * 4}%, ${0.75 - depth * 0.1})`;
            ctx.lineWidth = (maxDepth - depth + 1) * proj2.scale * 1.3 * scaleFactor;
            ctx.stroke();

            const branches = 3;
            for (let i = 0; i < branches; i++) {
                const childAngle = (i * (360 / branches)) + time * 3;
                drawPetal(x + extX, y + extY, z + extZ, size * 0.65, depth + 1, angleOffset + childAngle, maxDepth);
            }
        }

        // Обновление и отрисовка светящейся пыльцы
        function drawParticles() {
            ctx.shadowBlur = 8;
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];

                // Падение вниз с легким покачиванием по спирали
                p.y += p.speedY;
                p.x += Math.sin(time + p.seed) * 0.3;

                // Если искра упала слишком низко, возвращаем её наверх
                if (p.y > 300) {
                    p.y = -400;
                    p.x = (Math.random() - 0.5) * 400;
                    p.z = (Math.random() - 0.5) * 400;
                }

                // Применяем к искрам вращение сцены пользователя
                let rotP = rotateX(p.x, p.y, p.z, userAngleX + Math.sin(time * 0.1) * 8);
                rotP = rotateY(rotP.x, rotP.y, rotP.z, userAngleY);

                const proj = project(rotP.x, rotP.y, rotP.z);

                // Отрисовываем только если искра перед камерой
                if (proj.scale > 0) {
                    const pHue = (baseHue + p.seed * 3) % 360;
                    ctx.fillStyle = `hsla(${pHue}, 100%, 75%, ${0.6 * proj.scale})`;
                    ctx.shadowColor = `hsla(${pHue}, 100%, 60%, 0.6)`;
                    
                    ctx.beginPath();
                    ctx.arc(proj.x, proj.y, p.size * proj.scale * scaleFactor, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            ctx.shadowBlur = 0; // Сбрасываем тени для оптимизации фрактала
        }

        function animate() {
            // Эффект глубокого неонового шлейфа (чуть прозрачнее фон для красивых хвостов искр)
            ctx.fillStyle = 'rgba(4, 4, 6, 0.12)'; 
            ctx.fillRect(0, 0, width, height);

            time += 0.02;
            baseHue = (baseHue + 0.2) % 360; // Плавная автоматическая смена цвета (радуга)
            
            if (!isDragging) {
                userAngleY += 0.15; // Медленное авто-вращение
            }

            // Сначала рисуем пыльцу (она будет частично за цветком и вокруг него)
            drawParticles();

            // Рисуем сам 3D цветок
            const layers = 5;
            const baseSize = Math.min(width, height) * 0.23;
            for (let i = 0; i < layers; i++) {
                const layerAngle = i * (360 / layers);
                drawPetal(0, 0, 0, baseSize, 1, layerAngle, 4);
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
