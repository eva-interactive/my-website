<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Кубик Рубика со сбросом</title>
    <meta name="description" content="Интерактивная визуализация в цифровом портфолио Eva Interactive." />
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        h3 {
            margin: 10px;
            font-weight: normal;
            text-align: center;
            font-size: 15px;
            line-height: 1.4;
            color: #aaa;
        }

        /* 3D Сцена */
        .scene {
            width: 220px;
            height: 220px;
            perspective: 1000px;
            margin: 25px;
        }

        /* Контейнер куба */
        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(-25deg) rotateY(45deg);
        }

        /* Стили больших граней */
        .face {
            position: absolute;
            width: 220px;
            height: 220px;
            border: 4px solid #111;
            box-sizing: border-box;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 4px;
            background-color: #111;
            padding: 4px;
            backface-visibility: hidden;
        }

        /* Маленькие наклейки */
        .sticker {
            border-radius: 4px;
            transition: background-color 0.15s ease;
        }

        /* Сборка куба в 3D пространстве */
        .face.U { transform: rotateX(90deg) translateZ(110px); }
        .face.D { transform: rotateX(-90deg) translateZ(110px); }
        .face.F { transform: translateZ(110px); }
        .face.B { transform: rotateY(180deg) translateZ(110px); }
        .face.L { transform: rotateY(-90deg) translateZ(110px); }
        .face.R { transform: rotateY(90deg) translateZ(110px); }

        /* Панель кнопок */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 90%;
            max-width: 320px;
            margin-top: 10px;
        }

        button {
            background-color: #333;
            color: white;
            border: 2px solid #555;
            padding: 12px;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            touch-action: manipulation;
        }

        button:active { background-color: #555; }

        /* Кнопка запутывания */
        .scramble-btn {
            grid-column: span 3;
            background-color: #b71212;
            border-color: #d01c1c;
            font-weight: bold;
        }
        .scramble-btn:active { background-color: #e02222; }

        /* Новая кнопка сброса */
        .reset-btn {
            grid-column: span 3;
            background-color: #444;
            border-color: #666;
            font-weight: bold;
            color: #ffb3b3;
        }
        .reset-btn:active { background-color: #555; }
    </style>
</head>

<body>

    <h3>Вращение камеры: свайп по экрану<br>Вращение слоев: кнопки внизу</h3>

    <div class="scene">
        <div class="cube" id="cubeInstance">
            <div class="face U" id="face-U"></div>
            <div class="face D" id="face-D"></div>
            <div class="face F" id="face-F"></div>
            <div class="face B" id="face-B"></div>
            <div class="face L" id="face-L"></div>
            <div class="face R" id="face-R"></div>
        </div>
    </div>

    <div class="controls">
        <button class="scramble-btn" onclick="scrambleCube()">Запутать кубик 🎲</button>
        <button class="reset-btn" onclick="resetCube()">Сбросить кубик 🔄</button>
        
        <button onclick="rotateFace('F')">F (Перед)</button>
        <button onclick="rotateFace('R')">R (Право)</button>
        <button onclick="rotateFace('U')">U (Верх)</button>
        <button onclick="rotateFace('B')">B (Зад)</button>
        <button onclick="rotateFace('L')">L (Лево)</button>
        <button onclick="rotateFace('D')">D (Низ)</button>
    </div>

    <script>
        // Цвета: Белый, Желтый, Зеленый, Синий, Оранжевый, Красный
        const COLORS = { U: '#ffffff', D: '#ded016', F: '#11872f', B: '#134ba8', L: '#e06611', R: '#b71212' };
        
        // Переменная для хранения текущего состояния кубика
        let cubeState = {};

        // Функция возврата кубика в идеально собранное состояние
        function resetCube() {
            cubeState = {
                U: Array(9).fill('U'), D: Array(9).fill('D'),
                F: Array(9).fill('F'), B: Array(9).fill('B'),
                L: Array(9).fill('L'), R: Array(9).fill('R')
            };
            renderCube();
        }

        // Отрисовка куба на экране
        function renderCube() {
            for (let face in cubeState) {
                const faceDiv = document.getElementById(`face-${face}`);
                faceDiv.innerHTML = '';
                cubeState[face].forEach(colorKey => {
                    const sticker = document.createElement('div');
                    sticker.className = 'sticker';
                    sticker.style.backgroundColor = COLORS[colorKey];
                    faceDiv.appendChild(sticker);
                });
            }
        }

        // Поворот матрицы самой грани 3х3 по часовой стрелке
        function rotateFaceMatrix(face) {
            const s = cubeState[face];
            cubeState[face] = [
                s[6], s[3], s[0],
                s[7], s[4], s[1],
                s[8], s[2], s[5]
            ];
        }

        // Матрица перемещения смежных наклеек при повороте слоев
        function rotateLayer(f1, i1, f2, i2, f3, i3, f4, i4) {
            let temp = [cubeState[f1][i1[0]], cubeState[f1][i1[1]], cubeState[f1][i1[2]]];
            
            for(let i=0; i<3; i++) cubeState[f1][i1[i]] = cubeState[f4][i4[i]];
            for(let i=0; i<3; i++) cubeState[f4][i4[i]] = cubeState[f3][i3[i]];
            for(let i=0; i<3; i++) cubeState[f3][i3[i]] = cubeState[f2][i2[i]];
            for(let i=0; i<3; i++) cubeState[f2][i2[i]] = temp[i];
        }

        // Главный обработчик логики вращения
        function rotateFace(face) {
            rotateFaceMatrix(face);

            if (face === 'F') {
                rotateLayer('U', [6,7,8], 'R', [0,3,6], 'D', [2,1,0], 'L', [8,5,2]);
            } else if (face === 'B') {
                rotateLayer('U', [2,1,0], 'L', [0,3,6], 'D', [6,7,8], 'R', [8,5,2]);
            } else if (face === 'U') {
                rotateLayer('B', [2,1,0], 'R', [2,1,0], 'F', [2,1,0], 'L', [2,1,0]);
            } else if (face === 'D') {
                rotateLayer('F', [6,7,8], 'R', [6,7,8], 'B', [6,7,8], 'L', [6,7,8]);
            } else if (face === 'L') {
                rotateLayer('U', [0,3,6], 'F', [0,3,6], 'D', [0,3,6], 'B', [8,5,2]);
            } else if (face === 'R') {
                rotateLayer('U', [8,5,2], 'B', [0,3,6], 'D', [8,5,2], 'F', [8,5,2]);
            }
            renderCube();
        }

        // Функция автоматического перемешивания
        function scrambleCube() {
            const faces = ['U', 'D', 'F', 'B', 'L', 'R'];
            let count = 0;
            let interval = setInterval(() => {
                const randomFace = faces[Math.floor(Math.random() * faces.length)];
                rotateFace(randomFace);
                count++;
                if (count >= 20) clearInterval(interval);
            }, 120);
        }

        // Вращение камеры (свайпы)
        let cube = document.getElementById('cubeInstance');
        let currentX = -25, currentY = 45;
        let isDragging = false, startX = 0, startY = 0;

        function startDrag(x, y) { isDragging = true; startX = x; startY = y; }
        function moveDrag(x, y) {
            if (!isDragging) return;
            currentY += (x - startX) * 0.5;
            currentX -= (y - startY) * 0.5;
            cube.style.transform = `rotateX(${currentX}deg) rotateY(${currentY}deg)`;
            startX = x; startY = y;
        }
        function endDrag() { isDragging = false; }

        window.addEventListener('mousedown', e => startDrag(e.clientX, e.clientY));
        window.addEventListener('mousemove', e => moveDrag(e.clientX, e.clientY));
        window.addEventListener('mouseup', endDrag);
        
        window.addEventListener('touchstart', e => startDrag(e.touches[0].clientX, e.touches[0].clientY));
        window.addEventListener('touchmove', e => moveDrag(e.touches[0].clientX, e.touches[0].clientY));
        window.addEventListener('touchend', endDrag);

        // Инициализируем собранный куб при первом запуске
        resetCube();
    </script>
