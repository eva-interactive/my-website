<body>
    <div class="digital-time" id="digital">00:00:00</div>
    <canvas id="bgCanvas"></canvas>
    <canvas id="clockCanvas"></canvas>

    <script>
        const clockCanvas = document.getElementById('clockCanvas');
        const ctx = clockCanvas.getContext('2d');
        const bgCanvas = document.getElementById('bgCanvas');
        const bgCtx = bgCanvas.getContext('2d');
        const digital = document.getElementById('digital');

        function resize() {
            const w = document.documentElement.clientWidth;
            const h = document.documentElement.clientHeight;
            clockCanvas.width = w;
            clockCanvas.height = h;
            bgCanvas.width = w;
            bgCanvas.height = h;
            initMatrix();
        }
        window.addEventListener('resize', resize);

        // --- КВАНТОВАЯ РАДУЖНАЯ МАТРИЦА ---
        const chars = "010101XYZΔΛΞΩΨΦ";
        const fontSize = 16;
        
        // Палитра сочных неоновых коммерческих цветов
        const colors = [
            'rgba(0, 243, 255, 0.45)',  /* Кибер-бирюзовый */
            'rgba(189, 0, 255, 0.45)',  /* Пурпурный */
            'rgba(0, 81, 255, 0.45)',   /* Глубокий синий */
            'rgba(0, 162, 255, 0.45)',  /* Светло-синий */
            'rgba(113, 0, 255, 0.45)'   /* Фиолетовый */
        ];
        
        let columns;
        let drops;
        let dropColors; // Массив для хранения цвета каждой отдельной струи

        function initMatrix() {
            columns = Math.floor(bgCanvas.width / fontSize);
            drops = [];
            dropColors = [];
            
            for (let x = 0; x < columns; x++) {
                drops[x] = Math.random() * -50; 
                // Назначаем каждой колонке свой случайный цвет из палитры
                dropColors[x] = colors[Math.floor(Math.random() * colors.length)];
            }
        }

        function drawBackground() {
            bgCtx.fillStyle = 'rgba(1, 1, 5, 0.06)';
            bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);

            bgCtx.font = 'bold ' + fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                
                // Эффект яркой белой искры в голове падающей капли
                if(Math.random() > 0.98) {
                    bgCtx.fillStyle = '#ffffff';
                } else {
                    bgCtx.fillStyle = dropColors[i]; // Берем индивидуальный цвет нити
                }

                bgCtx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > bgCanvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                    // При перезапуске капли сверху можно обновить ей цвет
                    dropColors[i] = colors[Math.floor(Math.random() * colors.length)];
                }
                drops[i] += 0.7;
            }
        }

        // --- АНАЛОГОВЫЕ ЧАСЫ ---
        function drawClock() {
            ctx.clearRect(0, 0, clockCanvas.width, clockCanvas.height);
            
            const now = new Date();
            const hrs = now.getHours();
            const mins = now.getMinutes();
            const secs = now.getSeconds();
            const ms = now.getMilliseconds();

            digital.innerText = 
                String(hrs).padStart(2, '0') + ':' + 
                String(mins).padStart(2, '0') + ':' + 
                String(secs).padStart(2, '0');

            const cx = clockCanvas.width / 2;
            const cy = clockCanvas.height / 2;
            const radius = Math.min(cx, cy) * 0.6;

            const radSec = ((secs + ms / 1000) * 6 * Math.PI) / 180;
            const radMin = ((mins + secs / 60) * 6 * Math.PI) / 180;
            const radHr = (((hrs % 12) + mins / 60) * 30 * Math.PI) / 180;

            function drawRing(r, angle, color, blurColor, thickness) {
                ctx.save();
                ctx.shadowBlur = 15;
                ctx.shadowColor = blurColor;
                ctx.strokeStyle = color;
                ctx.lineWidth = thickness;
                
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, 2 * Math.PI);
                ctx.stroke();

                ctx.beginPath();
                ctx.lineCap = 'round';
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx + Math.sin(angle) * (r * 0.95), cy - Math.cos(angle) * (r * 0.95));
                ctx.stroke();
                ctx.restore();
            }

            drawRing(radius, radSec, '#00f3ff', '#00a2ff', 2);
            drawRing(radius * 0.8, radMin, '#bd00ff', '#7100ff', 4);
            drawRing(radius * 0.6, radHr, '#0051ff', '#0011ff', 6);

            // Сетка-радар
            ctx.strokeStyle = 'rgba(0, 243, 255, 0.05)';
            for(let i = 1; i <= 5; i++) {
                ctx.beginPath();
                ctx.arc(cx, cy, radius * (i * 0.2), 0, 2 * Math.PI);
                ctx.stroke();
            }
        }

        function tick() {
            drawBackground();
            drawClock();
            requestAnimationFrame(tick);
        }

        resize();
        tick();
    </script>
