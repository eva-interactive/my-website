<!DOCTYPE html>
<html lang="ru">

    <style>

        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; }

    </style>
</head>
    <!-- Yandex.Metrika counter -->
    <script type="text/javascript" >
       (function(m,e,t,r,i,k,a){m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
       m[i].l=1*new Date();
       for (var j = 0; j < e.length; j++) {if (e[j].r===r) { return; }}
       k=e.createElement(t),a=e.getElementsByTagName(t),k.async=1,k.src=r,a.parentNode.insertBefore(k,a)})

<body>
<canvas id="canvas3d"></canvas>
<script>
const canvas = document.getElementById('canvas3d');
const ctx = canvas.getContext('2d');

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Математический движок для 3D проекции без библиотек
const points = [];
const numPoints = 1200; // Количество точек в 3D структуре
const radius = 180;     // Радиус 3D сферы

// Генерируем точки сложной математической структуры (Сфера косинусов / Тор)
for (let i = 0; i < numPoints; i++) {
    let u = Math.random() * Math.PI * 2;
    let v = Math.acos((Math.random() * 2) - 1);
    
    // Сложная геометрия с пульсацией узора
    let mod = 1 + 0.3 * Math.sin(6 * u) * Math.cos(6 * v); 
    
    let x = radius * mod * Math.sin(v) * Math.cos(u);
    let y = radius * mod * Math.sin(v) * Math.sin(u);
    let z = radius * mod * Math.cos(v);
    
    points.push({x, y, z, baseColor: Math.floor(u * 50)});
}

// Углы вращения объекта
let angleX = 0.01;
let angleY = 0.01;
let angleZ = 0.005;

// Интерактив: вращение пальцем по экрану
let targetSpeedX = 0.01;
let targetSpeedY = 0.01;

window.addEventListener('touchmove', (e) => {
    let touch = e.touches[0];
    targetSpeedX = (touch.clientX / canvas.width - 0.5) * 0.1;
    targetSpeedY = (touch.clientY / canvas.height - 0.5) * 0.1;
});

window.addEventListener('mousemove', (e) => {
    targetSpeedX = (e.clientX / canvas.width - 0.5) * 0.05;
    targetSpeedY = (e.clientY / canvas.height - 0.5) * 0.05;
});

function animate() {
    // Эффект Motion Blur (плавное затухание следов частиц)
    ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Плавное приближение скорости к заданной пользователем
    angleX += (targetSpeedY - angleX) * 0.05;
    angleY += (targetSpeedX - angleY) * 0.05;

    // Матрица поворота
    let cosX = Math.cos(angleX), sinX = Math.sin(angleX);
    let cosY = Math.cos(angleY), sinY = Math.sin(angleY);
    let cosZ = Math.cos(angleZ), sinZ = Math.sin(angleZ);

    // Массив для сортировки точек по глубине (Z-буфер для правильного рендеринга)
    let projectedPoints = [];

    points.forEach(p => {
        // Вращение по оси X
        let y1 = p.y * cosX - p.z * sinX;
        let z1 = p.z * cosX + p.y * sinX;

        // Вращение по оси Y
        let x2 = p.x * cosY - z1 * sinY;
        let z2 = z1 * cosY + p.x * sinY;

        // Вращение по оси Z
        let x3 = x2 * cosZ - y1 * sinZ;
        let y3 = y1 * cosZ + x2 * sinZ;

        // Обновляем исходные координаты для непрерывного вращения
        p.x = x2; p.y = y3; p.z = z2;

        // Расстояние от камеры до объекта (перспектива)
        let cameraDistance = 400;
        let fov = 400; // Поле зрения
        let scale = fov / (cameraDistance + p.z);

        // Проекция 3D на 2D экран смартфона
        let screenX = (canvas.width / 2) + x3 * scale;
        let screenY = (canvas.height / 2) + y3 * scale;

        projectedPoints.push({
            x: screenX,
            y: screenY,
            z: p.z,
            scale: scale,
            color: p.baseColor
        });
    });

    // Сортируем точки от дальних к ближним (чтобы ближние перекрывали дальние)
    projectedPoints.sort((a, b) => b.z - a.z);

    // Отрисовка спроецированных 3D точек
    projectedPoints.forEach(p => {
        // Динамический цвет в зависимости от глубины Z и угла
        let hue = (p.color + Math.floor(p.z * 0.2)) % 360;
        // Чем ближе точка к экрану, тем она ярче и больше
        let alpha = Math.min(1, (p.z + radius) / (radius * 2) + 0.2);
        let size = Math.max(0.5, p.scale * 1.8);

        ctx.fillStyle = `hsla(${hue}, 100%, 65%, ${alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
        ctx.fill();

        // Добавляем соединительные лазерные линии для сложных узлов (эффект сетки)
        if (Math.random() < 0.015) {
            ctx.strokeStyle = `hsla(${hue}, 100%, 50%, ${alpha * 0.3})`;
            ctx.lineWidth = 0.5;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            // Линия к центру экрана
            ctx.lineTo(canvas.width / 2, canvas.height / 2);
            ctx.stroke();
        }
    });

    requestAnimationFrame(animate);
}

animate();
</script>
