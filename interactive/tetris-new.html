<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Тетрис 3D — Крупный Экран</title>
    <style>
        body,html{margin:0;padding:0;overflow:hidden;background-color:#0b0b12;height:100%}
        canvas{display:block;max-width:100vw;max-height:100vh;object-fit:contain;margin:0 auto}
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
<script>
    var canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d'), dpr = window.devicePixelRatio || 1;
    var w, h, cx, cy;

    var COLS = 12, ROWS = 18;
    var boardW, boardH, blockSize;
    var grid = new Int32Array(216);
    var score = 0, lastDropTime = Date.now();

    var normalInterval = 600, fastInterval = 35, currentInterval = normalInterval, touchStartY = 0;
    var currentPiece = { size: 0, matrix: new Int32Array(16), x: 0, y: 0, type: 0 };

    function getBlockColor(t, s) {
        var colors = {
            1: ['#00bfff', '#80e5ff', '#005f80'], 2: ['#ff8c00', '#ffc480', '#995400'],
            3: ['#8a2be2', '#d39eff', '#52148c'], 4: ['#32cd32', '#99e699', '#1e7b1e'],
            5: ['#ff1493', '#ff80c5', '#990c58'], 6: ['#1e90ff', '#90c8ff', '#0056b3'],
            7: ['#ffd700', '#fff080', '#998100']
        };
        return colors[t] ? colors[t][s] : '#000000';
    }

    function getShapeData(t, i) {
        if (t == 1) { if(i==0) return 4; return (i==5||i==6||i==7||i==8)?1:0; }
        if (t == 2) { if(i==0) return 2; return 1; }
        if (t == 3) { if(i==0) return 3; return (i==2||i==4||i==5||i==6)?1:0; }
        if (t == 4) { if(i==0) return 3; return (i==2||i==3||i==4||i==5)?1:0; }
        if (t == 5) { if(i==0) return 3; return (i==1||i==2||i==5||i==6)?1:0; }
        if (t == 6) { if(i==0) return 3; return (i==1||i==4||i==5||i==6)?1:0; }
        if (t == 7) { if(i==0) return 3; return (i==3||i==4||i==5||i==6)?1:0; }
        return 0;
    }

    function drawBlock(x, y, t) {
        var px = Math.floor(cx - boardW / 2 + x * blockSize);
        var py = Math.floor(cy - boardH / 2 + (17 - y) * blockSize);
        var size = blockSize, f = size * 0.15;

        var grad = ctx.createLinearGradient(px, py, px, py + size);
        grad.addColorStop(0, getBlockColor(t, 1)); grad.addColorStop(1, getBlockColor(t, 2));
        ctx.fillStyle = grad; ctx.fillRect(px, py, size, size);

        ctx.fillStyle = getBlockColor(t, 1); ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + f, py - f); ctx.lineTo(px + size - f, py - f); ctx.lineTo(px + size, py); ctx.closePath(); ctx.fill();
        ctx.fillStyle = getBlockColor(t, 2); ctx.beginPath(); ctx.moveTo(px + size, py); ctx.lineTo(px + size + f, py - f); ctx.lineTo(px + size + f, py + size - f); ctx.lineTo(px + size, py + size); ctx.closePath(); ctx.fill();
    }

    function spawnPiece() {
        var t = Math.floor(Math.random() * 7) + 1, s = getShapeData(t, 0);
        currentPiece.size = s; currentPiece.type = t;
        currentPiece.x = Math.floor((COLS - s) / 2);
        currentPiece.y = 17;

        for (var i = 0; i < 16; i++) currentPiece.matrix[i] = getShapeData(t, i + 1);
        if (collide()) { for (var i = 0; i < 216; i++) grid[i] = 0; score = 0; }
        currentInterval = normalInterval;
    }

    function collide() {
        var s = currentPiece.size;
        for (var r = 0; r < s; r++) {
            for (var c = 0; c < s; c++) {
                if (currentPiece.matrix[r * s + c] !== 0) {
                    var nx = currentPiece.x + c, ny = currentPiece.y - r;
                    if (nx < 0 || nx >= COLS || ny < 0) return true;
                    if (ny < ROWS && grid[ny * COLS + nx] !== 0) return true;
                }
            }
        }
        return false;
    }

    function merge() {
        var s = currentPiece.size;
        for (var r = 0; r < s; r++) {
            for (var c = 0; c < s; c++) {
                if (currentPiece.matrix[r * s + c] !== 0) {
                    var tx = currentPiece.x + c, ty = currentPiece.y - r;
                    if (ty >= 0 && ty < ROWS) grid[ty * COLS + tx] = currentPiece.type;
                }
            }
        }
    }

    function rotate() {
        var s = currentPiece.size, rot = new Int32Array(16), old = new Int32Array(currentPiece.matrix);
        for (var r = 0; r < s; r++) { for (var c = 0; c < s; c++) rot[c * s + (s - 1 - r)] = currentPiece.matrix[r * s + c]; }
        for (var i = 0; i < 16; i++) currentPiece.matrix[i] = rot[i];
        if (collide()) { for (var i = 0; i < 16; i++) currentPiece.matrix[i] = old[i]; }
    }

    function clearLines() {
        var cl = 0;
        for (var y = 17; y >= 0; y--) {
            var full = true;
            for (var x = 0; x < COLS; x++) { if (grid[y * COLS + x] === 0) { full = false; break; } }
            if (full) {
                cl++;
                for (var my = y; my < 17; my++) { for (var x = 0; x < COLS; x++) grid[my * COLS + x] = grid[(my + 1) * COLS + x]; }
                for (var x = 0; x < COLS; x++) grid[17 * COLS + x] = 0;
                y++;
            }
        }
        if (cl === 1) score += 100; else if (cl === 2) score += 300; else if (cl === 3) score += 700; else if (cl > 3) score += 1500;
    }

    function drop() {
        currentPiece.y--;
        if (collide()) { currentPiece.y++; merge(); clearLines(); spawnPiece(); }
    }

    function move(dir) {
        currentPiece.x += dir;
        if (collide()) currentPiece.x -= dir;
    }

    var isMoved = false;

    window.addEventListener('touchstart', function(e) {
        if (e.touches && e.touches.length > 0) {
            var tx = e.touches[0].clientX, ty = e.touches[0].clientY;
            touchStartY = ty; isMoved = false;
            if (ty <= h * 0.8) {
                if (tx < w * 0.3) { move(-1); isMoved = true; }
                else if (tx > w * 0.7) { move(1); isMoved = true; }
            } else {
                drop(); isMoved = true;
            }
        }
    });

    window.addEventListener('touchmove', function(e) {
        if (e.touches && e.touches.length > 0) {
            var dy = e.touches[0].clientY - touchStartY;
            if (dy > 25) { currentInterval = fastInterval; isMoved = true; }
        }
    });

    window.addEventListener('touchend', function() {
        currentInterval = normalInterval;
        if (!isMoved) { rotate(); }
    });

    window.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowLeft') move(-1); if (e.key === 'ArrowRight') move(1);
        if (e.key === 'ArrowDown') drop(); if (e.key === 'ArrowUp') rotate();
    });

    function resize() {
        w = window.innerWidth; h = window.innerHeight;
        canvas.width = w * dpr; canvas.height = h * dpr; ctx.scale(dpr, dpr);
        cx = w / 2; cy = h / 2;
        
        blockSize = Math.floor((h * 0.85) / ROWS);
        boardW = blockSize * COLS;
        boardH = blockSize * ROWS;
    }

    window.addEventListener('resize', resize);
    
    function draw() {
        ctx.fillStyle = '#0b0b12'; ctx.fillRect(0, 0, w, h);
        
        var startX = Math.floor(cx - boardW / 2);
        var startY = Math.floor(cy - boardH / 2);

        // Двойная неоновая сине-голубая рамка стакана (внутренней сетки больше нет)
        ctx.strokeStyle = '#005f80'; 
        ctx.lineWidth = 4;
        ctx.strokeRect(startX, startY, boardW, boardH);
        
        ctx.strokeStyle = '#00bfff'; 
        ctx.lineWidth = 1.5;
        ctx.strokeRect(startX, startY, boardW, boardH);

        // Отрисовка упавших блоков
        for (var y = 0; y < ROWS; y++) {
            for (var x = 0; x < COLS; x++) {
                var t = grid[y * COLS + x]; if (t > 0) drawBlock(x, y, t);
            }
        }

        // Отрисовка летящей фигуры
        var s = currentPiece.size;
        for (var r = 0; r < s; r++) {
            for (var c = 0; c < s; c++) {
                if (currentPiece.matrix[r * s + c] !== 0) {
                    var wx = currentPiece.x + c, wy = currentPiece.y - r;
                    if (wx >= 0 && wx < COLS && wy >= 0 && wy < ROWS) drawBlock(wx, wy, currentPiece.type);
                }
            }
        }

        // Вывод счета
        ctx.fillStyle = '#00bfff'; ctx.font = 'bold 18px monospace';
        ctx.fillText('СЧЁТ: ' + score, startX, startY - 20);
    }

    function loop() {
        var now = Date.now();
        if (now - lastDropTime > currentInterval) { drop(); lastDropTime = now; }
        draw();
        requestAnimationFrame(loop);
    }

    resize();
    spawnPiece();
    loop();
</script>
</body>
</html>
