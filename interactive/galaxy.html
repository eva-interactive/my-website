<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Солнечная Система с Луной</title>
    <meta name="description" content="Интерактивная визуализация в цифровом портфолио Eva Interactive." />
    <style>

       m[i].l=1*new Date();
       for (var j = 0; j < e.length; j++) {if (e[j].r===r) { return; }}

<body>
    <div id="info">Земля, Луна, пояс астероидов и мерцающие звезды работают.</div>
    
    <div id="controls">
        <button onclick="changeZoom(0.1)">Приблизить (+)</button>
        <button onclick="changeZoom(-0.1)">Отдалить (-)</button>
    </div>

    <canvas id="space"></canvas>

    <script>
        const canvas = document.getElementById('space');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let zoom = 1.0;

        function changeZoom(amount) {
            zoom = Math.max(0.3, Math.min(2.5, zoom + amount));
        }

        // 1. Создание мерцающих звезд
        const stars = [];
        for (let i = 0; i < 150; i++) {
            stars.push({
                x: Math.random(),
                y: Math.random(),
                size: Math.random() * 1.6 + 0.4,
                alpha: Math.random(),
                twinkleSpeed: Math.random() * 0.04 + 0.01,
                twinkleDirection: Math.random() > 0.5 ? 1 : -1
            });
        }

        // 2. Падающие звезды (метеоры)
        const shootingStars = [];
        function createShootingStar() {
            if (Math.random() > 0.98 && shootingStars.length < 2) {
                shootingStars.push({
                    x: Math.random() * canvas.width * 0.8,
                    y: Math.random() * canvas.height * 0.4,
                    length: Math.random() * 60 + 30,
                    speedX: Math.random() * 6 + 5,
                    speedY: Math.random() * 3 + 2,
                    opacity: 1.0,
                    fadeOutSpeed: 0.02
                });
            }
        }

        // 3. Генерация пояса астероидов
        const asteroids = [];
        for (let i = 0; i < 180; i++) {
            asteroids.push({
                orbit: Math.random() * 14 + 122,
                angle: Math.random() * Math.PI * 2,
                speed: Math.random() * 0.002 + 0.006,
                size: Math.random() * 1.0 + 0.4,
                color: Math.random() > 0.5 ? '#8a8583' : '#696564'
            });
        }

        // 8 планет Солнечной системы
        const planets = [
            { name: 'Меркурий', size: 3,   color: '#9E9E9E', orbit: 40,  speed: 0.035 },
            { name: 'Венера',   size: 6,   color: '#E3BB76', orbit: 60,  speed: 0.025 },
            { name: 'Земля',    size: 6.5, color: '#2277FF', orbit: 85,  speed: 0.018, hasMoon: true },
            { name: 'Марс',     size: 4.5, color: '#C1440E', orbit: 110, speed: 0.014 },
            { name: 'Юпитер',   size: 16,  color: '#D4A373', orbit: 150, speed: 0.008 },
            { name: 'Сатурн',   size: 13,  color: '#EAE2B7', orbit: 195, speed: 0.006, hasRings: true },
            { name: 'Уран',     size: 9,   color: '#4EA8DE', orbit: 240, speed: 0.004 },
            { name: 'Нептун',   size: 8.5, color: '#48CAE4', orbit: 285, speed: 0.003 }
        ];

        planets.forEach(p => p.angle = Math.random() * Math.PI * 2);

        // Угол Луны (обновляется отдельно!)
        let moonAngle = 0;

        function drawFrame() {
            ctx.fillStyle = '#03030b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            // Звезды
            stars.forEach(s => {
                s.alpha += s.twinkleSpeed * s.twinkleDirection;
                if (s.alpha >= 1.0) { s.alpha = 1.0; s.twinkleDirection = -1; }
                if (s.alpha <= 0.15) { s.alpha = 0.15; s.twinkleDirection = 1; }
                ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
                ctx.beginPath();
                ctx.arc(s.x * canvas.width, s.y * canvas.height, s.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // Метеоры
            createShootingStar();
            for (let i = shootingStars.length - 1; i >= 0; i--) {
                let m = shootingStars[i];
                m.x += m.speedX; m.y += m.speedY; m.opacity -= m.fadeOutSpeed;
                if (m.opacity <= 0) { shootingStars.splice(i, 1); continue; }
                ctx.strokeStyle = `rgba(255, 255, 255, ${m.opacity})`;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(m.x, m.y);
                ctx.lineTo(m.x - m.length * 0.6, m.y - m.length * 0.3);
                ctx.stroke();
            }

            // Орбиты планет
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
            ctx.lineWidth = 1;
            planets.forEach(planet => {
                ctx.beginPath();
                ctx.arc(centerX, centerY, planet.orbit * zoom, 0, Math.PI * 2);
                ctx.stroke();
            });

            // Пояс астероидов
            asteroids.forEach(ast => {
                ast.angle += ast.speed;
                let astX = centerX + Math.cos(ast.angle) * (ast.orbit * zoom);
                let astY = centerY + Math.sin(ast.angle) * (ast.orbit * zoom);
                ctx.fillStyle = ast.color;
                ctx.beginPath();
                ctx.arc(astX, astY, ast.size * zoom, 0, Math.PI * 2);
                ctx.fill();
            });

            // Солнце
            ctx.fillStyle = '#ffcc00';
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#ffaa00';
            ctx.beginPath();
            ctx.arc(centerX, centerY, 20 * zoom, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0; 

            // Обновляем угол Луны строго ОДИН раз за кадр анимации
            moonAngle += 0.05;

            // Планеты
            planets.forEach(planet => {
                planet.angle += planet.speed;

                let planetX = centerX + Math.cos(planet.angle) * (planet.orbit * zoom);
                let planetY = centerY + Math.sin(planet.angle) * (planet.orbit * zoom);
                let currentSize = planet.size * zoom;

                if (planet.hasRings) {
                    ctx.strokeStyle = 'rgba(234, 226, 183, 0.3)';
                    ctx.lineWidth = currentSize * 0.3;
                    ctx.beginPath();
                    ctx.arc(planetX, planetY, currentSize * 1.4, 0, Math.PI * 2);
                    ctx.stroke();
                }

                ctx.fillStyle = planet.color;
                ctx.beginPath();
                ctx.arc(planetX, planetY, currentSize, 0, Math.PI * 2);
                ctx.fill();

                // Эффект тени
                let shadowGrad = ctx.createRadialGradient(
                    planetX - currentSize * 0.3, planetY - currentSize * 0.3, 0,
                    planetX, planetY, currentSize
                );
                shadowGrad.addColorStop(0, 'rgba(0,0,0,0)');
                shadowGrad.addColorStop(0.8, 'rgba(0,0,0,0.6)');
                shadowGrad.addColorStop(1, 'rgba(0,0,0,0.9)');
                ctx.fillStyle = shadowGrad;
                ctx.beginPath();
                ctx.arc(planetX, planetY, currentSize, 0, Math.PI * 2);
                ctx.fill();

                // Рендеринг Луны
                if (planet.hasMoon) {
                    let moonOrbitRadius = 13 * zoom;
                    let moonX = planetX + Math.cos(moonAngle) * moonOrbitRadius;
                    let moonY = planetY + Math.sin(moonAngle) * moonOrbitRadius;

                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
                    ctx.beginPath();
                    ctx.arc(planetX, planetY, moonOrbitRadius, 0, Math.PI * 2);
                    ctx.stroke();

                    ctx.fillStyle = '#b0b0b0';
                    ctx.beginPath();
                    ctx.arc(moonX, moonY, 1.8 * zoom, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.font = '11px sans-serif';
                ctx.fillText(planet.name, planetX + currentSize + 4, planetY + 4);
            });
        }

        setInterval(drawFrame, 33);
    </script>
