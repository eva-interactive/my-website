<body>

    <div id="hud">КВАНТОВЫЙ ФРАКТАЛ ПИФАГОРА<br><span style="color:#ffffff;">Водите пальцем, чтобы менять геометрию и изгиб ветвей</span></div>
    <canvas id="fractalCanvas"></canvas>

    <script>
        const canvas = document.getElementById('fractalCanvas');
        const ctx = canvas.getContext('2d');
        
        const dpr = window.devicePixelRatio || 1;
        let w = canvas.width = window.innerWidth * dpr;
        let h = canvas.height = window.innerHeight * dpr;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';

        // Параметры фрактала
        let maxDepth = 10; // Глубина прорисовки (ветвления)
        let angleBias = 0; // Наклон от пальца по горизонтали
        let branchLengthRatio = 0.75; // Длина дочерних ветвей

        // Координаты пальца для плавного интерактивного ветра
        let targetAngle = Math.PI / 4; 
        let currentAngle = Math.PI / 4;
        let targetBias = 0;

        window.addEventListener('pointermove', (e) => {
            // Движение по горизонтали меняет наклон (ветер)
            targetBias = (e.clientX * dpr - w / 2) * 0.0015;
            // Движение по вертикали меняет угол раскрытия веток фрактала
            targetAngle = (e.clientY * dpr / h) * (Math.PI / 2);
        });

        // Плавное возвращение к базовой форме, если убрать палец
        window.addEventListener('pointerup', () => {
            targetAngle = Math.PI / 4.5;
            targetBias = 0;
        });

        // Рекурсивная функция прорисовки фрактального дерева
        function drawTree(x1, y1, length, angle, depth, hue) {
            if (depth === 0) return;

            // Вычисляем координаты конца текущей ветки
            const x2 = x1 + Math.cos(angle) * length;
            const y2 = y1 + Math.sin(angle) * length;

            // Интерактивный неоновый цвет: плавно меняется от корня к кончикам ветвей
            ctx.strokeStyle = `hsl(${(hue + depth * 12) % 360}, 100%, 60%)`;
            // Толщина веток уменьшается с глубиной фрактала
            ctx.lineWidth = Math.max(1, depth * 0.6 * dpr);

            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();

            // Длина веток следующего уровня
            const nextLength = length * branchLengthRatio;

            // Левое ответвление (математическая рекурсия)
            drawTree(x2, y2, nextLength, angle - currentAngle + angleBias, depth - 1, hue);
            // Правое ответвление
            drawTree(x2, y2, nextLength, angle + currentAngle + angleBias, depth - 1, hue);
        }

        let baseHue = 180; // Начальный цвет (бирюзовый неон)

        function loop() {
            // Эффект затухания для шлейфа (создает ощущение, что фрактал дышит и светится)
            ctx.fillStyle = 'rgba(2, 2, 4, 0.25)';
            ctx.fillRect(0, 0, w, h);

            // Плавная инерция движения для кинематографичного эффекта
            currentAngle += (targetAngle - currentAngle) * 0.05;
            angleBias += (targetBias - angleBias) * 0.05;

            // Медленно переливаем базовый цвет
            baseHue = (baseHue + 0.2) % 360;

            // Запуск прорисовки дерева от нижней центральной точки экрана строго вверх (-Math.PI/2)
            const startLength = h * 0.22; // Базовая высота ствола
            drawTree(w / 2, h, startLength, -Math.PI / 2, maxDepth, baseHue);

            requestAnimationFrame(loop);
        }

        loop();

        window.addEventListener('resize', () => {
            w = canvas.width = window.innerWidth * dpr;
            h = canvas.height = window.innerHeight * dpr;
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
        });
    </script>
