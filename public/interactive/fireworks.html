cat << 'EOF' > fireworks.html
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Праздничный Салют: Россия</title>
    <meta name="description" content="Интерактивная визуализация в цифровом портфолио Eva Interactive." />
    <style>
        body { margin: 0; overflow: hidden; background-color: #020204; touch-action: none; font-family: sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        /* ГАРАНТИРОВАННАЯ НАДПИСЬ С МОЩНЫМ НЕОНОВЫМ СВЕЧЕНИЕМ */
        #title-text {
            position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%);
            color: #ffffff; font-size: 32px; font-weight: 900; text-align: center;
            letter-spacing: 2px; z-index: 999; width: 90%; line-height: 1.4;
            text-transform: uppercase;
            text-shadow: 0 0 10px #ff0055, 0 0 20px #0055ff, 0 0 30px #ffffff;
            pointer-events: none; /* Чтобы буквы не мешали нажимать пальцем */
        }
        
        #hint {
            position: absolute; bottom: 5%; left: 50%; transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.3); font-size: 13px; letter-spacing: 1px;
            pointer-events: none; text-align: center; width: 90%;
        }
    </style>
</head>
<body>

    <!-- Ваша праздничная надпись поверх салюта -->
    <div id="title-text">Да здравствует мир во всём Мире!</div>
    
    <div id="hint">Нажимайте пальцем в любое место экрана для запуска залпов!</div>
    <canvas id="canvas3d"></canvas>

    <script>
        const canvas = document.getElementById('canvas3d');
        const ctx = canvas.getContext('2d');
        
        const dpr = window.devicePixelRatio || 1;
        let w = canvas.width = window.innerWidth * dpr;
        let h = canvas.height = window.innerHeight * dpr;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';

        const particles = [];
        const rockets = [];

        const gravity = 0.06 * dpr;
        const friction = 0.96; 

        class Rocket {
            constructor(startX, startY, targetX, targetY) {
                this.x = startX;
                this.y = startY;
                this.targetX = targetX;
                this.targetY = targetY;
                
                const angle = Math.atan2(targetY - startY, targetX - startX);
                const speed = 13 * dpr;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                
                this.hue = Math.floor(Math.random() * 360);
                this.size = 3 * dpr;
                this.dead = false;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.vy >= 0 || Math.hypot(this.targetX - this.x, this.targetY - this.y) < 15) {
                    this.dead = true;
                    explode(this.x, this.y, this.hue);
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `hsl(${this.hue}, 100%, 70%)`;
                ctx.fill();
            }
        }

        class Particle {
            constructor(x, y, hue) {
                this.x = x;
                this.y = y;
                
                const angle = Math.random() * Math.PI * 2;
                const speed = (Math.random() * 7 + 2) * dpr;
                
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                
                this.hue = hue;
                this.alpha = 1; 
                this.decay = Math.random() * 0.012 + 0.006; // Искры живут чуть дольше
                this.size = (Math.random() * 4 + 2) * dpr;
            }

            update() {
                this.vx *= friction;
                this.vy *= friction;
                this.vy += gravity;
                
                this.x += this.vx;
                this.y += this.vy;
                
                this.alpha -= this.decay;
            }

            draw() {
                if (this.alpha <= 0) return;
                ctx.save();
                ctx.globalAlpha = this.alpha;
                
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);

                const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
                gradient.addColorStop(0, '#ffffff'); 
                gradient.addColorStop(0.3, `hsl(${this.hue}, 100%, 60%)`); 
                gradient.addColorStop(1, 'transparent');

                ctx.fillStyle = gradient;
                ctx.fill();
                ctx.restore();
            }
        }

        function explode(x, y, hue) {
            const sparkCount = 120; // Сделали взрывы чуть пышнее
            for (let i = 0; i < sparkCount; i++) {
                particles.push(new Particle(x, y, hue));
            }
        }

        window.addEventListener('pointerdown', (e) => {
            const targetX = e.clientX * dpr;
            const targetY = e.clientY * dpr;
            rockets.push(new Rocket(targetX, h, targetX, targetY));
        });

        function loop() {
            ctx.fillStyle = 'rgba(2, 2, 4, 0.15)';
            ctx.fillRect(0, 0, w, h);

            if (Math.random() < 0.02 && rockets.length < 3) {
                const rx = Math.random() * w;
                const ry = Math.random() * (h * 0.5) + h * 0.1;
                rockets.push(new Rocket(rx, h, rx, ry));
            }

            for (let i = rockets.length - 1; i >= 0; i--) {
                rockets[i].update();
                if (rockets[i].dead) {
                    rockets.splice(i, 1);
                } else {
                    rockets[i].draw();
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                } else {
                    particles[i].draw();
                }
            }

            requestAnimationFrame(loop);
        }

        loop();

        window.addEventListener('resize', () => {
            w = canvas.width = window.innerWidth * dpr;
            h = canvas.height = window.innerHeight * dpr;
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
        });
    </script>

</body>
</html>
