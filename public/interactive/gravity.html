<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Гравитационные Волны Пространства-Времени</title>
    <meta name="description" content="Интерактивная визуализация в цифровом портфолио Eva Interactive." />
    <style>
        body { margin: 0; overflow: hidden; background-color: #010103; color: white; font-family: sans-serif; }
        canvas { display: block; background-color: #010103; touch-action: none; }
        #info { position: absolute; top: 10px; width: 100%; text-align: center; font-size: 14px; color: #00ffcc; background: rgba(0,0,0,0.8); padding: 6px 0; pointer-events: none; text-shadow: 0 0 5px #00ffcc; }
    </style>
</head>
<body>
    <div id="info">Физика пространства: черные дыры, звездная пыль и гравитационная рябь. Водите пальцем!</div>
    <canvas id="space"></canvas>

    <script>
        const canvas = document.getElementById('space');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let mouse = { x: -1000, y: -1000, active: false };

        // Двойная система черных дыр
        const binarySystem = {
            centerX: 0, centerY: 0,
            angle: 0, orbitRadius: 50,
            speed: 0.04, mass: 65
        };

        const spacing = 16; // Шаг сетки

        // Создаем массив космической пыли
        const dustParticles = [];
        for (let i = 0; i < 150; i++) {
            dustParticles.push({
                origX: Math.random() * window.innerWidth,
                origY: Math.random() * window.innerHeight,
                size: Math.random() * 1.5 + 0.5,
                baseColor: Math.random() > 0.5 ? '#00ffff' : '#ff3300'
            });
        }

        function drawFrame() {
            ctx.fillStyle = 'rgba(1, 1, 3, 0.28)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            binarySystem.centerX = canvas.width / 2;
            binarySystem.centerY = canvas.height / 2;
            binarySystem.angle += binarySystem.speed;

            // Координаты сингулярностей
            const bh1x = binarySystem.centerX + Math.cos(binarySystem.angle) * binarySystem.orbitRadius;
            const bh1y = binarySystem.centerY + Math.sin(binarySystem.angle) * binarySystem.orbitRadius;
            const bh2x = binarySystem.centerX - Math.cos(binarySystem.angle) * binarySystem.orbitRadius;
            const bh2y = binarySystem.centerY - Math.sin(binarySystem.angle) * binarySystem.orbitRadius;

            // ОТРИСОВКА ИСКАЖЕННОЙ СЕТКИ 
            // Горизонтальные линии
            for (let y = spacing / 2; y < canvas.height; y += spacing) {
                ctx.beginPath();
                for (let x = 0; x < canvas.width; x += 8) {
                    let transform = getDistortedCoords(x, y, bh1x, bh1y, bh2x, bh2y);
                    if (x === 0) ctx.moveTo(transform.x, transform.y);
                    else ctx.lineTo(transform.x, transform.y);
                }
                ctx.strokeStyle = 'rgba(0, 110, 255, 0.15)';
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            // Вертикальные линии
            for (let x = spacing / 2; x < canvas.width; x += spacing) {
                ctx.beginPath();
                for (let y = 0; y < canvas.height; y += 8) {
                    let transform = getDistortedCoords(x, y, bh1x, bh1y, bh2x, bh2y);
                    if (y === 0) ctx.moveTo(transform.x, transform.y);
                    else ctx.lineTo(transform.x, transform.y);
                }
                ctx.strokeStyle = 'rgba(0, 110, 255, 0.15)';
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            // ОТРИСОВКА ЖИВОЙ ЗВЕЗДНОЙ ПЫЛИ
            dustParticles.forEach(p => {
                let transform = getDistortedCoords(p.origX, p.origY, bh1x, bh1y, bh2x, bh2y);
                let intensity = Math.abs(transform.waveIntensity);
                if (intensity > 5) {
                    ctx.fillStyle = `rgba(255, 100, 0, ${Math.min(1, intensity / 10)})`;
                } else {
                    ctx.fillStyle = p.baseColor;
                }
                ctx.beginPath();
                ctx.arc(transform.x, transform.y, p.size + intensity * 0.1, 0, Math.PI * 2);
                ctx.fill();
            });

            // ОТРИСОВКА ЧЕРНЫХ ДЫР
            drawBlackHole(bh1x, bh1y, 10, binarySystem.angle * 1.5);
            drawBlackHole(bh2x, bh2y, 10, binarySystem.angle * 1.5 + Math.PI);
        }

        // Математическая модель искажения
        function getDistortedCoords(origX, origY, bh1x, bh1y, bh2x, bh2y) {
            let dx1 = origX - bh1x; let dy1 = origY - bh1y;
            let dist1 = Math.sqrt(dx1 * dx1 + dy1 * dy1) || 1;

            let dx2 = origX - bh2x; let dy2 = origY - bh2y;
            let dist2 = Math.sqrt(dx2 * dx2 + dy2 * dy2) || 1;

            let pull1 = (binarySystem.mass * 15) / (dist1 + 25);
            let pull2 = (binarySystem.mass * 15) / (dist2 + 25);

            let wave1 = Math.sin(dist1 * 0.05 - binarySystem.angle * 2.5) * (1800 / (dist1 + 70));
            let wave2 = Math.sin(dist2 * 0.05 - binarySystem.angle * 2.5) * (1800 / (dist2 + 70));

            let targetX = origX - (dx1 / dist1) * pull1 - (dx1 / dist1) * wave1 - (dx2 / dist2) * pull2 - (dx2 / dist2) * wave2;
            let targetY = origY - (dy1 / dist1) * pull1 - (dy1 / dist1) * wave1 - (dy2 / dist2) * pull2 - (dy2 / dist2) * wave2;

            // Исправленное искажение от пальца
            if (mouse.active) {
                let dxM = origX - mouse.x; let dyM = origY - mouse.y;
                let distM = Math.sqrt(dxM * dxM + dyM * dyM) || 1;
                if (distM < 160) {
                    let pullM = (70 * (160 - distM)) / 160;
                    targetX -= (dxM / distM) * pullM;
                    targetY -= (dyM / distM) * pullM;
                }
            }

            return { x: targetX, y: targetY, waveIntensity: wave1 + wave2 };
        }

        function drawBlackHole(x, y, r, rotationAngle) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rotationAngle);

            let grad = ctx.createRadialGradient(0, 0, r * 0.5, 0, 0, r * 3.5);
            grad.addColorStop(0, '#000000');
            grad.addColorStop(0.2, '#ffffff');
            grad.addColorStop(0.4, '#ff6600');
            grad.addColorStop(0.8, '#4a00e0');
            grad.addColorStop(1, 'transparent');
            
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(0, 0, r * 3.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.beginPath();
            ctx.ellipse(0, 0, r * 2.5, r * 1.2, 0, 0, Math.PI);
            ctx.fill();

            ctx.restore();
        }

        // ИСПРАВЛЕННЫЕ сенсоры Android с правильным обращением к e.touches[0]
        canvas.addEventListener('touchstart', e => {
            if (e.touches.length > 0) {
                mouse.active = true;
                mouse.x = e.touches[0].clientX;
                mouse.y = e.touches[0].clientY;
            }
        });
        canvas.addEventListener('touchmove', e => {
            if (e.touches.length > 0) {
                mouse.x = e.touches[0].clientX;
                mouse.y = e.touches[0].clientY;
            }
        });
        canvas.addEventListener('touchend', () => { mouse.active = false; });
        canvas.addEventListener('touchcancel', () => { mouse.active = false; });

        setInterval(drawFrame, 30);
    </script>
