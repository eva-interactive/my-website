<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Физический симулятор: Сингулярность</title>
    <meta name="description" content="Интерактивная визуализация в цифровом портфолио Eva Interactive." />
    <style>
        body { margin: 0; overflow: hidden; background-color: #020205; touch-action: none; font-family: sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #hud {
            position: absolute; top: 5%; left: 50%; transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.4); font-size: 13px; text-align: center;
            pointer-events: none; width: 90%; letter-spacing: 1px; line-height: 1.4;
        }
    </style>
</head>
    <!-- Yandex.Metrika counter -->
    <script type="text/javascript" >
       (function(m,e,t,r,i,k,a){m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
       m[i].l=1*new Date();
       for (var j = 0; j < e.length; j++) {if (e[j].r===r) { return; }}
       k=e.createElement(t),a=e.getElementsByTagName(t),k.async=1,k.src=r,a.parentNode.insertBefore(k,a)})
       (window, document, "script", "https://yandex.ru", "ym");
       ym(112304908, "init", { clickmap:true, trackLinks:true, accurateTrackBounce:true, webvisor:true });
    </script>
    <noscript><div><img src="https://yandex.ru" style="position:absolute; left:-9999px;" alt="" /></div></noscript>

<body>

    <div id="hud">ГРАВИТАЦИОННАЯ СИНГУЛЯРНОСТЬ<br><span style="color:#00f0ff;">Зажмите пальцем экран, чтобы создать черную дыру</span></div>
    <canvas id="canvas3d"></canvas>

    <script>
        const canvas = document.getElementById('canvas3d');
        const ctx = canvas.getContext('2d');
        
        const dpr = window.devicePixelRatio || 1;
        let w = canvas.width = window.innerWidth * dpr;
        let h = canvas.height = window.innerHeight * dpr;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';

        const particles = [];
        const particleCount = 2500; // Оптимально для сочности и скорости 60 кадров/сек

        // Координаты черной дыры (по умолчанию в центре)
        let hole = { x: w / 2, y: h / 2, mass: 450 * dpr, active: false };

        // Инициализация частиц света
        for (let i = 0; i < particleCount; i++) {
            // Генерируем частицы по кругу вокруг центра
            const angle = Math.random() * Math.PI * 2;
            const radius = Math.random() * (w * 0.4) + 50 * dpr;
            
            particles.push({
                x: w / 2 + Math.cos(angle) * radius,
                y: h / 2 + Math.sin(angle) * radius,
                // Первоначальная космическая скорость (орбитальное вращение)
                vx: -Math.sin(angle) * (Math.random() * 2 + 1) * dpr,
                vy: Math.cos(angle) * (Math.random() * 2 + 1) * dpr,
                size: (Math.random() * 1.5 + 1) * dpr,
                hue: Math.floor(Math.random() * 60) + 170 // Сине-бирюзовый космический неон
            });
        }

        // Интерактивное управление через Pointer Events
        window.addEventListener('pointerdown', (e) => {
            hole.x = e.clientX * dpr;
            hole.y = e.clientY * dpr;
            hole.mass = 1200 * dpr; // При таче масса и притяжение резко возрастают
            hole.active = true;
        });

        window.addEventListener('pointermove', (e) => {
            if (hole.active) {
                hole.x = e.clientX * dpr;
                hole.y = e.clientY * dpr;
            }
        });

        window.addEventListener('pointerup', () => {
            hole.mass = 450 * dpr; // Возвращаем обычное фоновое притяжение
            hole.active = false;
        });
        window.addEventListener('pointercancel', () => { hole.active = false; });

        function loop() {
            // Эффект затухания (супер-шлейф движения космического газа)
            ctx.fillStyle = 'rgba(2, 2, 5, 0.12)';
            ctx.fillRect(0, 0, w, h);

            // Если палец убран, черная дыра медленно дрейфует в центре
            if (!hole.active) {
                hole.x = w / 2 + Math.sin(Date.now() * 0.001) * 30 * dpr;
                hole.y = h / 2 + Math.cos(Date.now() * 0.001) * 30 * dpr;
            }

            // Просчет гравитации для каждой из 2500 частиц
            for (let i = 0; i < particleCount; i++) {
                const p = particles[i];

                // Вычисляем расстояние до черной дыры по теореме Пифагора
                const dx = hole.x - p.x;
                const dy = hole.y - p.y;
                const distance = Math.hypot(dx, dy);

                // Физика Ньютона: Сила притяжения обратно пропорциональна квадрату расстояния
                // Добавляем минимальный порог (30), чтобы частицы не улетали в бесконечность в самом центре
                const force = hole.mass / (distance * distance + 30);

                // Вектор ускорения частицы
                p.vx += (dx / distance) * force;
                p.vy += (dy / distance) * force;

                // Применяем легкое космическое торможение (сопротивление среды)
                p.vx *= 0.98;
                p.vy *= 0.98;

                // Обновляем координаты
                p.x += p.vx;
                p.y += p.vy;

                // Динамически меняем цвет: чем ближе к сингулярности, тем горячее (фиолетовый/розовый)
                let currentHue = p.hue;
                if (distance < 120 * dpr) {
                    currentHue = Math.floor(Math.random() * 40) + 310; // Розовый взрыв энергии в центре
                }

                // Рисуем искру света
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = `hsl(${currentHue}, 100%, 70%)`;
                ctx.fill();
            }

            requestAnimationFrame(loop);
        }

        loop();

        // Адаптация под поворот экрана
        window.addEventListener('resize', () => {
            w = canvas.width = window.innerWidth * dpr;
            h = canvas.height = window.innerHeight * dpr;
            if (!hole.active) { hole.x = w / 2; hole.y = h / 2; }
        });
    </script>

    <script data-goatcounter="https://goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
