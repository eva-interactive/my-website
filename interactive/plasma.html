cat << 'EOF' > Плазма.html
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Шторм Жидкой Плазмы</title>
    <meta name="description" content="Интерактивная визуализация в цифровом портфолио Eva Interactive." />
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #010103; touch-action: none; user-select: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #hint { position: absolute; top: 15px; width: 100%; text-align: center; font-family: monospace; font-size: 11px; color: #00ffff; font-weight: bold; pointer-events: none; text-shadow: 0 0 5px #00ffff; z-index: 10; }
    </style>
</head>
<body>
    <div id="hint">ВОДИТЕ ПАЛЬЦЕМ ДЛЯ УПРАВЛЕНИЯ ТЕЧЕНИЕМ ПЛАЗМЫ</div>
    <canvas id="plasmaCanvas"></canvas>

    <script>
        var canvas = document.getElementById('plasmaCanvas');
        var ctx = canvas.getContext('2d');

        var width = window.innerWidth;
        var height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;

        // Координаты магического фокуса (пальца)
        var pointerX = width / 2;
        var pointerY = height / 2;
        var targetX = width / 2;
        var targetY = height / 2;

        // Вся информация о частицах плазмы хранится в ОДНОЙ текстовой строке.
        // Формат: "X,Y,VX,VY,Life,Radius,Hue|X,Y..." (Никаких скобок и массивов!)
        var plasmaString = '';
        var maxParticles = 140;

        function createSingleParticle() {
            var pAngle = Math.random() * Math.PI * 2;
            var pSpeed = Math.random() * 2 + 0.5;
            
            var x = pointerX + Math.cos(pAngle) * (Math.random() * 20);
            var y = pointerY + Math.sin(pAngle) * (Math.random() * 20);
            var vx = Math.cos(pAngle) * pSpeed;
            var vy = Math.sin(pAngle) * pSpeed;
            var life = 1.0;
            var radius = Math.random() * 12 + 6;
            var hue = Math.floor(Math.random() * 60) + 160; // Сине-циановая базовая гамма
            
            return x + ',' + y + ',' + vx + ',' + vy + ',' + life + ',' + radius + ',' + hue;
        }

        function initPlasma() {
            plasmaString = '';
            for (var i = 0; i < maxParticles; i++) {
                plasmaString += createSingleParticle();
                if (i < maxParticles - 1) plasmaString += '|';
            }
        }

        // Интерактивное управление магическими потоками плазмы
        window.addEventListener('pointerdown', function(e) {
            targetX = e.clientX; targetY = e.clientY;
        });
        window.addEventListener('pointermove', function(e) {
            targetX = e.clientX; targetY = e.clientY;
        });

        function animate() {
            // Эффект вязкого жидкого трения (очищаем экран полупрозрачным слоем)
            ctx.fillStyle = 'rgba(1, 1, 3, 0.08)';
            ctx.fillRect(0, 0, width, height);

            // Плавное следование фокуса за пальцем
            pointerX += (targetX - pointerX) * 0.1;
            pointerY += (targetY - pointerY) * 0.1;

            var timeFactor = Date.now() * 0.001;

            // Разбираем текстовую строку на частицы
            var particles = plasmaString.split('|');
            var newPlasmaString = '';

            // Режим наложения "screen" для создания неонового свечения магической жидкости
            ctx.globalCompositeOperation = 'screen';

            for (var i = 0; i < particles.length; i++) {
                var data = particles[i].split(',');
                
                var x = parseFloat(data[0]);
                var y = parseFloat(data[1]);
                var vx = parseFloat(data[2]);
                var vy = parseFloat(data[3]);
                var life = parseFloat(data[4]);
                var radius = parseFloat(data[5]);
                var hue = parseInt(data[6]);

                // 1. Физика течения жидкой плазмы (Векторное поле волн + завихрения)
                var waveX = Math.sin(y * 0.01 + timeFactor * 2) * 0.2;
                var waveY = Math.cos(x * 0.01 + timeFactor * 1.5) * 0.2;
                
                // Притяжение к пальцу пользователя
                var dx = pointerX - x;
                var dy = pointerY - y;
                var dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > 10 && dist < 250) {
                    vx += (dx / dist) * 0.15;
                    vy += (dy / dist) * 0.15;
                }

                vx += waveX;
                vy += waveY;
                
                // Эффект вязкости жидкости (замедление)
                vx *= 0.97;
                vy *= 0.97;

                x += vx;
                y += vy;
                life -= 0.006; // Плавное растворение энергии

                // Динамическое изменение цвета (плазма переливается от фиолетового к бирюзовому)
                hue = (hue + 1) % 360;

                // Если частица погасла или улетела далеко, перерождаем её у фокуса
                if (life <= 0 || x < 0 || x > width || y < 0 || y > height) {
                    var freshParticle = createSingleParticle();
                    var freshData = freshParticle.split(',');
                    x = parseFloat(freshData[0]);
                    y = parseFloat(freshData[1]);
                    vx = parseFloat(freshData[2]);
                    vy = parseFloat(freshData[3]);
                    life = 1.0;
                    radius = parseFloat(freshData[5]);
                    hue = parseInt(freshData[6]);
                }

                // 2. Отрисовка сгустков энергии
                ctx.beginPath();
                ctx.arc(x, y, radius * life, 0, Math.PI * 2);
                
                // Создаем объемное неоновое свечение для каждого сгустка
                ctx.fillStyle = 'hsla(' + hue + ', 100%, 55%, ' + (life * 0.4) + ')';
                ctx.fill();

                // Сохраняем обновленные параметры обратно в текстовую строку
                newPlasmaString += x + ',' + y + ',' + vx + ',' + vy + ',' + life + ',' + radius + ',' + hue;
                if (i < particles.length - 1) newPlasmaString += '|';
            }

            plasmaString = newPlasmaString;

            // Возвращаем стандартный режим рисования
            ctx.globalCompositeOperation = 'source-over';

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', function() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        initPlasma();
        animate();
    </script>

    <script data-goatcounter="https://goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
EOF
echo "Магический шторм жидкой плазмы сохранен в Плазма.html!"
