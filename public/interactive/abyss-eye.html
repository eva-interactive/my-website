<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мистический Туннель 3D</title>
    <meta name="description" content="Интерактивная визуализация в цифровом портфолио Eva Interactive." />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #010105; font-family: sans-serif; user-select: none; touch-action: none; }
        canvas { display: block; width: 100%; height: 100%; image-rendering: auto; }
        #info {
            position: absolute; top: 15px; left: 15px;
            color: #fff; background: rgba(5, 5, 20, 0.95);
            padding: 12px 18px; border-radius: 8px;
            font-size: 14px; line-height: 1.5; pointer-events: none;
            border: 1px solid #c084fc;
        }
        #fps { color: #c084fc; font-weight: bold; }
    </style>
</head>
<body>

    <div id="info">
        <strong>Redmi Pad SE • Око Бездны</strong><br>
        Плавность: <span id="fps">0</span><br>
        Существо: Стабильный 3D-рендер объекта
    </div>

    <canvas id="renderCanvas"></canvas>

    <script>
        const canvas = document.getElementById('renderCanvas');
        // ✅ ИСПРАВЛЕНИЕ 1: Убрали alpha и desynchronized. На мобильных они вызывают фризы.
        const ctx = canvas.getContext('2d'); 
        
        const fpsCounter = document.getElementById('fps');

        let width, height;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            
            // ✅ ИСПРАВЛЕНИЕ 2: Убрали scaleFactor. Холст теперь равен размеру экрана.
            // Это критично для FPS на планшете.
            canvas.width = width;
            canvas.height = height;
            
            ctx.imageSmoothingEnabled = true;
        }

        window.addEventListener('resize', resize);
        resize();

        let lastTime = performance.now();
        let frameCount = 0;

        let tiltX = 0, tiltY = 0;
        let targetTiltX = 0, targetTiltY = 0;

        const speed = 0.025;
        const walls = [];
        const maxWalls = 12;

        // Инициализируем стены
        for (let i = 0; i < maxWalls; i++) {
            walls.push({
                z: (i / maxWalls),
                hue: (i * 30) % 360,
                closedSide: Math.floor(Math.random() * 4)
            });
        }

        // Частицы
        const particles = [];
        for(let i=0; i<30; i++) {
            particles.push({ 
                x: (Math.random() - 0.5) * 400, 
                y: (Math.random() - 0.5) * 400, 
                z: Math.random() 
            });
        }

        // Параметры мистического ока
        let creatureZ = 1.0;
        const creatureSpeed = 0.016;
        let creatureHue = 280;

        window.addEventListener('pointermove', (e) => {
            const x = e.clientX / window.innerWidth - 0.5;
            const y = e.clientY / window.innerHeight - 0.5;
            
            // Защита от NaN, если событие странное
            if (!isNaN(x) && !isNaN(y)) {
                targetTiltX = x * 2.5;
                targetTiltY = y * 2.5;
            }
        });

        window.addEventListener('pointerout', () => {
            targetTiltX = 0; 
            targetTiltY = 0;
        });

        function drawWallPanel(ctx, p1, p2, p3, p4, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.lineTo(p3.x, p3.y);
            ctx.lineTo(p4.x, p4.y);
            ctx.closePath();
            ctx.fill();
            // Убрали stroke(), чтобы не тратить ресурсы на обводку каждой панели
        }

        // Функция отрисовки мистического Ока Бездны
        function drawCreature(ctx, cx, cy, time) {
            const cFactor = 1 / (creatureZ + 0.01);
            const crX = cx + (tiltX * (1 - creatureZ) * 250);
            const crY = cy + (tiltY * (1 - creatureZ) * 250);

            const crRadius = Math.max(3, (width * 0.035) * cFactor);
            const crAlpha = Math.min(1, (1 - creatureZ) * 2.2);

            const pulse = Math.sin(time * 12) * (crRadius * 0.12);

            // Аура существа
            ctx.fillStyle = `hsla(${creatureHue}, 100%, 65%, ${crAlpha * 0.25})`;
            ctx.beginPath();
            ctx.arc(crX, crY, crRadius + 8 + pulse, 0, Math.PI * 2);
            ctx.fill();

            // Тело существа
            ctx.fillStyle = `hsla(${creatureHue}, 100%, 50%, ${crAlpha})`;
            ctx.beginPath();
            ctx.arc(crX, crY, crRadius + pulse, 0, Math.PI * 2);
            ctx.fill();

            // Светящийся центр ока
            ctx.fillStyle = `rgba(255, 255, 255, ${crAlpha})`;
            ctx.beginPath();
            ctx.arc(crX, crY, (crRadius * 0.35) + pulse * 0.2, 0, Math.PI * 2);
            ctx.fill();
        }

        function draw(time) {
            // Чуть более темный фон для глубины
            ctx.fillStyle = '#010206';
            ctx.fillRect(0, 0, width, height);

            const cx = width / 2;
            const cy = height / 2;

            tiltX += (targetTiltX - tiltX) * 0.06;
            tiltY += (targetTiltY - tiltY) * 0.06;

            // Звездная пыль
            for(let i=0; i<particles.length; i++) {
                let p = particles[i];
                p.z -= speed * 1.3;
                if(p.z <= 0) p.z = 1;

                const pScale = 200 / (p.z + 0.01);
                // Оптимизированный расчет позиции
                const px = cx + (p.x + tiltX * 80) * (pScale * 0.005);
                const py = cy + (p.y + tiltY * 80) * (pScale * 0.005);
                
                const pSize = (1 - p.z) * 2.5;

                ctx.fillStyle = `rgba(168, 85, 247, ${1 - p.z})`;
                ctx.fillRect(px, py, pSize, pSize);
            }

            // Физика Ока Бездны
            creatureZ -= creatureSpeed;
            if (creatureZ <= 0.02) {
                creatureZ = 1.0;
                creatureHue = (creatureHue + 50) % 360;
            }

            let creatureDrawn = false;

            // Рендерим лабиринт от дальних к ближним
            for (let i = maxWalls - 1; i >= 0; i--) {
                let current = walls[i];

                current.z -= speed;
                if (current.z <= 0) {
                    current.z = 1.0;
                    current.closedSide = Math.floor(Math.random() * 4);
                }

                let nextIndex = i - 1;
                if (nextIndex < 0) nextIndex = maxWalls - 1;
                let next = walls[nextIndex];

                // Рисуем существо, если оно ближе текущей стены
                if (!creatureDrawn && creatureZ > current.z) {
                    drawCreature(ctx, cx, cy, time);
                    creatureDrawn = true;
                }

                // Проекция текущей стены
                const f1 = 1 / (current.z + 0.01);
                const w1 = width * 0.22 * f1;
                const h1 = height * 0.22 * f1;
                
                const ox1 = cx + (tiltX * (1 - current.z) * 220);
                const oy1 = cy + (tiltY * (1 - current.z) * 220);

                const cTL = { x: ox1 - w1, y: oy1 - h1 };
                const cTR = { x: ox1 + w1, y: oy1 - h1 };
                const cBR = { x: ox1 + w1, y: oy1 + h1 };
                const cBL = { x: ox1 - w1, y: oy1 + h1 };

                // Проекция следующей стены
                const f2 = 1 / (next.z + 0.01);
                const w2 = width * 0.22 * f2;
                const h2 = height * 0.22 * f2;
                
                const ox2 = cx + (tiltX * (1 - next.z) * 220);
                const oy2 = cy + (tiltY * (1 - next.z) * 220);

                const nTL = { x: ox2 - w2, y: oy2 - h2 };
                const nTR = { x: ox2 + w2, y: oy2 - h2 };
                const nBR = { x: ox2 + w2, y: oy2 + h2 };
                const nBL = { x: ox2 - w2, y: oy2 + h2 };

                const alpha = Math.min(0.6, (1 - current.z) * 1.2);
                
                ctx.strokeStyle = `hsla(${current.hue}, 100%, 65%, ${alpha})`;
                ctx.lineWidth = 1.5;

                const wallColor = `hsla(${current.hue}, 90%, 18%, ${alpha * 0.35})`;
                const gridColor = `hsla(${current.hue}, 100%, 50%, ${alpha * 0.12})`;

                // Отрисовка панелей
                drawWallPanel(ctx, cTL, cTR, nTR, nTL, current.closedSide === 0 ? wallColor : gridColor);
                drawWallPanel(ctx, cTR, cBR, nBR, nTR, current.closedSide === 1 ? wallColor : gridColor);
                drawWallPanel(ctx, cBR, cBL, nBL, nBR, current.closedSide === 2 ? wallColor : gridColor);
                drawWallPanel(ctx, cBL, cTL, nTL, nBL, current.closedSide === 3 ? wallColor : gridColor);

                // Контур стены (один раз вместо 4 линий)
                ctx.strokeRect(cTL.x, cTL.y, w1 * 2, h1 * 2);
            }

            // Если существо пролетело все стены, рисуем его поверх
            if (!creatureDrawn) {
                drawCreature(ctx, cx, cy, time);
            }
        }

        function updateFPS() {
            frameCount++;
            const now = performance.now();
            if (now - lastTime >= 1000) {
                fpsCounter.textContent = frameCount + ' FPS';
                frameCount = 0;
                lastTime = now;
            }
        }

        function loop() {
            draw(performance.now() * 0.001);
            updateFPS();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
